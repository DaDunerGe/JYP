<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蒋语 · 更新 v1.1.5</title>
<style>
  :root {
    --bg: #0B0B0E;
    --card: #16161A;
    --line: #232329;
    --text: #F2F2F4;
    --text-2: #8E8E96;
    --accent: #A78BFA;
    --accent-dim: #7C6FAD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(900px 600px at 50% -10%, #1D1430 0%, #0B0B0E 60%);
    min-height: 100vh; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 400px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 28px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.7);
  }

  .brand { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #fff; margin-bottom: 4px; }
  .brand em { font-style: normal; color: var(--accent); }
  .sub { text-align: center; font-size: 13px; color: var(--text-2); margin-bottom: 18px; }

  .version-badge {
    display: inline-flex; align-items: baseline; gap: 8px;
    background: rgba(167,139,250,.14); border: 1px solid rgba(167,139,250,.3);
    padding: 8px 16px; border-radius: 999px; margin: 0 auto 22px; width: fit-content;
  }
  .version-badge .v { font-size: 20px; font-weight: 800; color: var(--accent); }
  .version-badge .tag { font-size: 12px; color: var(--accent-dim); font-weight: 600; }

  .changelog { list-style: none; margin-bottom: 24px; }
  .changelog h3 { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 10px; }
  .changelog li {
    position: relative; padding: 8px 0 8px 22px; font-size: 14.5px; color: #E8E6EE;
    border-bottom: 1px solid var(--line); line-height: 1.5;
  }
  .changelog li:last-child { border-bottom: none; }
  .changelog li::before {
    content: ""; position: absolute; left: 4px; top: 16px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #A78BFA, #8B6FF0); color: #fff;
    text-decoration: none; font-size: 16px; font-weight: 700;
    padding: 15px 20px; border-radius: 14px; margin-bottom: 8px;
    box-shadow: 0 10px 24px -8px rgba(167,139,250,.6);
    transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.97); opacity: .9; }
  .btn svg { width: 18px; height: 18px; }
  .hint { text-align: center; font-size: 12px; color: var(--text-2); margin-bottom: 22px; }

  .steps { background: #101014; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .steps h3 { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 10px; }
  .steps ol { padding-left: 18px; }
  .steps li { font-size: 13px; color: #C9C7D1; line-height: 1.9; }

  .warn {
    font-size: 12.5px; color: #E8B86B; background: rgba(232,184,107,.1);
    border: 1px solid rgba(232,184,107,.25); border-radius: 12px; padding: 12px 14px; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">蒋<em>语</em></div>
      <div class="sub">移动端 · 手动更新</div>

      <div class="version-badge">
        <span class="v">v1.1.5</span>
        <span class="tag">最新版本</span>
      </div>

      <ul class="changelog">
        <h3>本次更新</h3>
        <li>修复上传页输入时输入框被键盘遮挡的问题</li>
      </ul>

      <a class="btn" href="https://github.com/dadunerge/JYP/raw/main/apk/JiangYu.apk" download="JiangYu-v1.1.5.apk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载并安装
      </a>
      <div class="hint">文件约 11 MB，下载后点击打开即可安装。若下载缓慢，请用<a href="apk/JiangYu.apk" style="color:var(--accent)">备用下载</a>。</div>

      <div class="steps">
        <h3>安装步骤</h3>
        <ol>
          <li>点上方「下载并安装」，等待下载完成</li>
          <li>在通知栏或下载目录找到 JiangYu-v1.1.5.apk，点击打开</li>
          <li>如提示「允许安装未知来源应用」，请允许后继续</li>
        </ol>
      </div>

      <div class="warn">
        ⚠️ 如果你之前安装过旧版「蒋语」，请先在手机设置里<b>卸载旧版</b>，再安装本版本，否则会提示「签名不一致」无法安装。
      </div>
    </div>
  </div>
</body>
</html>
