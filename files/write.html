<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            width: 100%;
            background: rgba(20, 12, 24, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(116, 73, 128, 0.4);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(116, 73, 128, 0.15);
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(116, 73, 128, 0.6);
            position: relative;
            white-space: nowrap;
            text-decoration: none;
        }

        .brand::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #744980;
            border-radius: 3px;
            box-shadow: 0 0 10px #744980;
        }

        .top-bar .page-label {
            font-size: 0.95rem;
            color: #b48bc2;
            letter-spacing: 0.5px;
        }

        .main-content {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.4rem;
            text-shadow: 0 0 12px rgba(116, 73, 128, 0.4);
        }

        .page-subtitle {
            font-size: 0.95rem;
            color: #9a7ba8;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: #b48bc2;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            background: rgba(20, 12, 24, 0.8);
            border: 1px solid rgba(116, 73, 128, 0.4);
            border-radius: 16px;
            padding: 0.9rem 1.2rem;
            color: #e0d4e8;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #744980;
            box-shadow: 0 0 20px rgba(116, 73, 128, 0.4);
            background: rgba(30, 18, 36, 0.9);
        }

        .form-textarea {
            min-height: 320px;
            resize: vertical;
            line-height: 1.7;
        }

        .form-hint {
            font-size: 0.8rem;
            color: #8a6d97;
            margin-top: 0.4rem;
            font-style: italic;
        }

        .publish-btn {
            background: #744980;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(116, 73, 128, 0.4);
            font-family: inherit;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .publish-btn:hover {
            background: #8c5a9e;
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.8);
            transform: translateY(-1px);
        }

        .publish-btn:active {
            transform: translateY(1px);
            box-shadow: 0 0 12px rgba(116, 73, 128, 0.6);
        }

        .publish-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: rgba(20, 12, 24, 0.98);
            border: 1px solid rgba(116, 73, 128, 0.7);
            border-radius: 32px;
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px -12px rgba(116, 73, 128, 0.5), 0 0 0 1px rgba(116, 73, 128, 0.3) inset;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.4rem 1.8rem;
            border-bottom: 1px solid rgba(116, 73, 128, 0.3);
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-close {
            background: rgba(116, 73, 128, 0.2);
            border: 1px solid rgba(116, 73, 128, 0.5);
            color: #e0c8eb;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: #744980;
            color: #fff;
            box-shadow: 0 0 18px rgba(116, 73, 128, 0.7);
        }

        .modal-body {
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1.2rem 1.8rem;
            border-top: 1px solid rgba(116, 73, 128, 0.3);
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            flex-shrink: 0;
        }

        .btn-secondary {
            background: rgba(116, 73, 128, 0.15);
            color: #d5c2dd;
            border: 1px solid rgba(116, 73, 128, 0.5);
            border-radius: 30px;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-secondary:hover { background: rgba(116, 73, 128, 0.3); }

        .btn-primary {
            background: #744980;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(116, 73, 128, 0.4);
        }

        .btn-primary:hover {
            background: #8c5a9e;
            box-shadow: 0 0 25px rgba(116, 73, 128, 0.7);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .folder-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .folder-item {
            background: rgba(116, 73, 128, 0.08);
            border: 1px solid rgba(116, 73, 128, 0.25);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .folder-item:hover {
            background: rgba(116, 73, 128, 0.25);
            border-color: rgba(116, 73, 128, 0.8);
        }

        .folder-item.selected {
            background: rgba(116, 73, 128, 0.35);
            border-color: #744980;
            box-shadow: 0 0 15px rgba(116, 73, 128, 0.4);
        }

        .folder-item .folder-icon { font-size: 1.2rem; }

        .folder-item .folder-name {
            font-size: 0.9rem;
            color: #d5c2dd;
            flex: 1;
        }

        .folder-item .folder-path {
            font-size: 0.75rem;
            color: #8a6d97;
        }

        .new-folder-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            margin-top: 0.5rem;
        }

        .new-folder-input {
            flex: 1;
            background: rgba(20, 12, 24, 0.8);
            border: 1px solid rgba(116, 73, 128, 0.4);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            color: #e0d4e8;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }

        .new-folder-input:focus {
            border-color: #744980;
            box-shadow: 0 0 15px rgba(116, 73, 128, 0.3);
        }

        .section-label {
            font-size: 0.85rem;
            color: #b48bc2;
            margin-bottom: 0.6rem;
            display: block;
        }

        .footer-deco {
            margin-top: 3rem;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #744980, #b48bc2, #744980, transparent);
            opacity: 0.6;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .top-bar { padding: 0.8rem 1.2rem; }
            .brand { font-size: 1.4rem; }
            .top-bar .page-label { font-size: 0.85rem; }
            .main-content { padding: 1.8rem 1rem; }
            .form-textarea { min-height: 220px; }
            .modal { border-radius: 24px; }
            .modal-header, .modal-body, .modal-footer { padding-left: 1.2rem; padding-right: 1.2rem; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="dadunerge.github.io/JYP" class="brand">蒋语</a>
        <span class="page-label">投稿</span>
    </header>

    <main class="main-content">
        <h2 class="page-title">写点什么</h2>
        <p class="page-subtitle">标题将作为文件名 · 作者可选，会自动落款在正文末尾</p>

        <div class="form-group">
            <label class="form-label" for="titleInput">标题 <span style="color:#c98da0;">*</span></label>
            <input type="text" id="titleInput" class="form-input" placeholder="给文章起个名字" maxlength="80">
            <div class="form-hint">将自动保存为 .txt 文件</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="contentInput">正文 <span style="color:#c98da0;">*</span></label>
            <textarea id="contentInput" class="form-textarea" placeholder="在这里写下你的文字…"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="authorInput">作者（可选）</label>
            <input type="text" id="authorInput" class="form-input" placeholder="署名，将自动落款在正文末尾" maxlength="40">
        </div>

        <button class="publish-btn" id="publishBtn">
            <span>🚀</span> 发布
        </button>

        <div class="footer-deco"></div>
    </main>

    <div class="modal-overlay" id="folderModal">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-title">选择保存位置</div>
                <button class="modal-close" id="folderModalClose">✕</button>
            </div>
            <div class="modal-body">
                <span class="section-label">已有文件夹</span>
                <div class="folder-list" id="folderList">
                    <div style="text-align:center;color:#8a6d97;font-style:italic;padding:1rem 0;">正在读取…</div>
                </div>

                <span class="section-label">新建文件夹（可选，留空则保存在 files/ 根目录）</span>
                <div class="new-folder-row">
                    <input type="text" id="newFolderInput" class="new-folder-input" placeholder="例如：随笔 / 小说">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="folderCancelBtn">取消</button>
                <button class="btn-primary" id="folderConfirmBtn">确认发布</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal" role="dialog" aria-modal="true" style="max-width:420px;">
            <div class="modal-header">
                <div class="modal-title" id="resultTitle">发布结果</div>
                <button class="modal-close" id="resultModalClose">✕</button>
            </div>
            <div class="modal-body" id="resultBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" id="resultOkBtn">好的</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 配置区
        // ============================================================
        const GITHUB_OWNER = 'dadunerge';
        const GITHUB_REPO = 'JYP';
        const GITHUB_BRANCH = 'main';

        // Token 字符位移（ASCII +1），运行时还原
        const _s = 'hjuivc`qbu`22CY7IPDZ1u{mGHPwjsFk1`F8K8MU:d:1[4s3U7j2kIkWQ8ZxquQHK7YWrzMNXMiFsVI335VNFgOYCZ{Fi';
        const GITHUB_TOKEN = [..._s].map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');

        // 页面在 /files/ 里，清单同目录，直接写文件名
        const MANIFEST_URL = 'files.json';

        // ============================================================
        // 全局状态
        // ============================================================
        const titleInput = document.getElementById('titleInput');
        const contentInput = document.getElementById('contentInput');
        const authorInput = document.getElementById('authorInput');
        const publishBtn = document.getElementById('publishBtn');

        const folderModal = document.getElementById('folderModal');
        const folderList = document.getElementById('folderList');
        const folderModalClose = document.getElementById('folderModalClose');
        const folderCancelBtn = document.getElementById('folderCancelBtn');
        const folderConfirmBtn = document.getElementById('folderConfirmBtn');
        const newFolderInput = document.getElementById('newFolderInput');

        const resultModal = document.getElementById('resultModal');
        const resultTitle = document.getElementById('resultTitle');
        const resultBody = document.getElementById('resultBody');
        const resultModalClose = document.getElementById('resultModalClose');
        const resultOkBtn = document.getElementById('resultOkBtn');

        let manifestCache = null;
        let selectedFolder = '';

        // ============================================================
        // 读取清单
        // ============================================================
        async function loadManifest() {
            if (manifestCache) return manifestCache;
            const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            manifestCache = await res.json();
            return manifestCache;
        }

        function collectFolders(entries, prefix = '') {
            const folders = [];
            for (const entry of entries) {
                if (entry.type === 'folder') {
                    const path = prefix ? `${prefix}/${entry.name}` : entry.name;
                    folders.push({ name: entry.name, path: path });
                    if (entry.children && entry.children.length) {
                        folders.push(...collectFolders(entry.children, path));
                    }
                }
            }
            return folders;
        }

        // ============================================================
        // 渲染目录选择
        // ============================================================
        async function renderFolderList() {
            folderList.innerHTML = '<div style="text-align:center;color:#8a6d97;font-style:italic;padding:1rem 0;">正在读取…</div>';

            try {
                const manifest = await loadManifest();
                const folders = collectFolders(manifest);

                folderList.innerHTML = '';

                const rootItem = document.createElement('div');
                rootItem.className = 'folder-item' + (selectedFolder === '' ? ' selected' : '');
                rootItem.innerHTML = `
                    <span class="folder-icon">📁</span>
                    <span class="folder-name">files/（根目录）</span>
                `;
                rootItem.addEventListener('click', () => {
                    selectedFolder = '';
                    renderFolderList();
                });
                folderList.appendChild(rootItem);

                for (const folder of folders) {
                    const item = document.createElement('div');
                    item.className = 'folder-item' + (selectedFolder === folder.path ? ' selected' : '');
                    item.innerHTML = `
                        <span class="folder-icon">📁</span>
                        <span class="folder-name">${folder.name}</span>
                        <span class="folder-path">${folder.path}</span>
                    `;
                    item.addEventListener('click', () => {
                        selectedFolder = folder.path;
                        newFolderInput.value = '';
                        renderFolderList();
                    });
                    folderList.appendChild(item);
                }

            } catch (err) {
                folderList.innerHTML = `<div style="text-align:center;color:#c98da0;font-style:italic;padding:1rem 0;">读取失败：${err.message}</div>`;
            }
        }

        // ============================================================
        // 弹窗控制
        // ============================================================
        function openFolderModal() {
            folderModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderFolderList();
        }

        function closeFolderModal() {
            folderModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function openResultModal(title, html) {
            resultTitle.textContent = title;
            resultBody.innerHTML = html;
            resultModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeResultModal() {
            resultModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // 文件名处理
        // ============================================================
        function sanitizeFilename(title) {
            let name = title.trim().replace(/[\\/:*?"<>|]/g, '_');
            name = name.replace(/^\.+/, '').replace(/\.+$/, '');
            if (name.length > 60) name = name.slice(0, 60);
            return name || '未命名';
        }

        // ============================================================
        // 发布到 GitHub
        // API 路径始终相对仓库根，带 files/ 前缀
        // ============================================================
        async function publishToGitHub(apiPath, content, author) {
            let finalContent = content;
            if (author.trim()) {
                finalContent += '\n\n—— ' + author.trim();
            }

            let sha = null;
            try {
                const checkRes = await fetch(
                    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${apiPath}?ref=${GITHUB_BRANCH}`,
                    {
                        headers: {
                            'Authorization': `Bearer ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github+json',
                        },
                    }
                );
                if (checkRes.ok) {
                    const data = await checkRes.json();
                    sha = data.sha;
                }
            } catch (e) {
                // 文件不存在，正常
            }

            const base64Content = btoa(unescape(encodeURIComponent(finalContent)));

            const payload = {
                message: `投稿: ${apiPath}`,
                content: base64Content,
                branch: GITHUB_BRANCH,
            };
            if (sha) payload.sha = sha;

            const res = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${apiPath}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                }
            );

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || `HTTP ${res.status}`);
            }

            return await res.json();
        }

        // ============================================================
        // 发布流程
        // ============================================================
        publishBtn.addEventListener('click', () => {
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title) {
                openResultModal('提示', '<p style="color:#c98da0;">请填写标题</p>');
                return;
            }
            if (!content) {
                openResultModal('提示', '<p style="color:#c98da0;">请填写正文</p>');
                return;
            }

            openFolderModal();
        });

        folderConfirmBtn.addEventListener('click', async () => {
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const author = authorInput.value.trim();

            let folder = selectedFolder;
            const newFolder = newFolderInput.value.trim();

            if (newFolder) {
                const cleanNew = newFolder.replace(/[\\:*?"<>|]/g, '_').replace(/^\/+|\/+$/g, '');
                if (cleanNew) folder = cleanNew;
            }

            const filename = sanitizeFilename(title) + '.txt';
            const apiPath = folder ? `files/${folder}/${filename}` : `files/${filename}`;

            folderConfirmBtn.disabled = true;
            folderConfirmBtn.textContent = '发布中…';

            try {
                await publishToGitHub(apiPath, content, author);

                closeFolderModal();
                openResultModal(
                    '发布成功',
                    `<p style="color:#b48bc2;">文件已提交：</p>
                     <p style="color:#e0d4e8;font-family:monospace;font-size:0.85rem;word-break:break-all;background:rgba(116,73,128,0.1);padding:0.8rem;border-radius:12px;margin-top:0.5rem;">${apiPath}</p>
                     <p style="color:#8a6d97;font-size:0.85rem;margin-top:1rem;">列表将在 1-2 分钟后自动更新</p>`
                );

                titleInput.value = '';
                contentInput.value = '';
                authorInput.value = '';
                selectedFolder = '';
                newFolderInput.value = '';
                manifestCache = null;

            } catch (err) {
                openResultModal('发布失败', `<p style="color:#c98da0;">${err.message}</p>`);
            } finally {
                folderConfirmBtn.disabled = false;
                folderConfirmBtn.textContent = '确认发布';
            }
        });

        folderModalClose.addEventListener('click', closeFolderModal);
        folderCancelBtn.addEventListener('click', closeFolderModal);
        resultModalClose.addEventListener('click', closeResultModal);
        resultOkBtn.addEventListener('click', closeResultModal);

        folderModal.addEventListener('click', (e) => {
            if (e.target === folderModal) closeFolderModal();
        });
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) closeResultModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (folderModal.classList.contains('active')) closeFolderModal();
                if (resultModal.classList.contains('active')) closeResultModal();
            }
        });

    </script>

</body>
</html>
