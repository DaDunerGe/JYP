<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蒋语 · 投稿</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            width: 100%;
            background: rgba(20, 12, 24, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(116, 73, 128, 0.4);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(116, 73, 128, 0.15);
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(116, 73, 128, 0.6);
            position: relative;
            white-space: nowrap;
            text-decoration: none;
        }

        .brand::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #744980;
            border-radius: 3px;
            box-shadow: 0 0 10px #744980;
        }

        .submit-link {
            background: #744980;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(116, 73, 128, 0.4);
            font-family: inherit;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
        }

        .submit-link:hover {
            background: #8c5a9e;
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.8);
            transform: translateY(-1px);
        }

        .submit-link:active {
            transform: translateY(1px);
            box-shadow: 0 0 12px rgba(116, 73, 128, 0.6);
        }

        .submit-link .icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* ===== 主内容区域 ===== */
        .main-content {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .page-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.4rem;
            text-shadow: 0 0 12px rgba(116, 73, 128, 0.4);
        }

        .page-subtitle {
            font-size: 0.95rem;
            color: #9a7ba8;
            margin-bottom: 2rem;
        }

        /* ===== 文件管理器 ===== */
        .file-manager {
            background: rgba(20, 12, 24, 0.6);
            border: 1px solid rgba(116, 73, 128, 0.4);
            border-radius: 28px;
            padding: 1rem 1.5rem;
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.12);
        }

        /* 改为一行一行显示 */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .file-item {
            background: rgba(116, 73, 128, 0.08);
            border: 1px solid rgba(116, 73, 128, 0.25);
            border-radius: 14px;
            padding: 0.8rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            word-break: break-word;
        }

        .file-item:hover {
            background: rgba(116, 73, 128, 0.25);
            border-color: rgba(116, 73, 128, 0.8);
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(116, 73, 128, 0.3);
        }

        .file-item .file-icon {
            font-size: 1.6rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(116, 73, 128, 0.6));
        }

        .file-item .file-name {
            font-size: 0.95rem;
            color: #d5c2dd;
            word-break: break-all;
            flex: 1;
        }

        .file-item.is-folder .file-icon {
            color: #b48bc2;
        }

        .empty-message {
            text-align: center;
            color: #8a6d97;
            font-style: italic;
            padding: 2rem 0;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 12, 24, 0.98);
            border: 1px solid rgba(116, 73, 128, 0.7);
            border-radius: 32px;
            width: 100%;
            max-width: 860px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px -12px rgba(116, 73, 128, 0.5), 0 0 0 1px rgba(116, 73, 128, 0.3) inset;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.4rem 1.8rem;
            border-bottom: 1px solid rgba(116, 73, 128, 0.3);
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .modal-title .file-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 6px rgba(116, 73, 128, 0.7));
        }

        .modal-close {
            background: rgba(116, 73, 128, 0.2);
            border: 1px solid rgba(116, 73, 128, 0.5);
            color: #e0c8eb;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: #744980;
            color: #fff;
            box-shadow: 0 0 18px rgba(116, 73, 128, 0.7);
        }

        .modal-body {
            padding: 1.8rem;
            overflow-y: auto;
            color: #e0d4e8;
            font-size: 1rem;
            flex: 1;
        }

        /* 文本内容 */
        .modal-body pre.text-content {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #e0d4e8;
            background: rgba(116, 73, 128, 0.08);
            padding: 1.2rem;
            border-radius: 16px;
            border: 1px solid rgba(116, 73, 128, 0.2);
        }

        /* 图片预览 */
        .modal-body .image-preview {
            max-width: 100%;
            max-height: 60vh;
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.4);
            border: 1px solid rgba(116, 73, 128, 0.4);
        }

        /* 弹窗内文件夹列表 —— 也改为一行一行 */
        .modal-body .inner-file-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .modal-body .inner-file-item {
            background: rgba(116, 73, 128, 0.08);
            border: 1px solid rgba(116, 73, 128, 0.25);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
            word-break: break-word;
        }

        .modal-body .inner-file-item:hover {
            background: rgba(116, 73, 128, 0.25);
            border-color: rgba(116, 73, 128, 0.8);
            transform: translateX(4px);
        }

        .modal-body .inner-file-item .file-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .modal-body .inner-file-item .file-name {
            font-size: 0.9rem;
            color: #d5c2dd;
            flex: 1;
        }

        .modal-loading {
            text-align: center;
            color: #9a7ba8;
            font-style: italic;
            padding: 2rem 0;
        }

        .modal-error {
            text-align: center;
            color: #c98da0;
            font-style: italic;
            padding: 2rem 0;
        }

        /* 底部装饰线 */
        .footer-deco {
            margin-top: 3rem;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #744980, #b48bc2, #744980, transparent);
            opacity: 0.6;
            border-radius: 2px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .top-bar {
                padding: 0.8rem 1.2rem;
            }
            .brand {
                font-size: 1.4rem;
            }
            .submit-link {
                padding: 0.5rem 1.1rem;
                font-size: 0.9rem;
            }
            .submit-link .icon {
                font-size: 1rem;
            }
            .main-content {
                padding: 1.8rem 1rem;
            }
            .file-manager {
                padding: 0.8rem 1rem;
            }
            .file-item {
                padding: 0.7rem 1rem;
                border-radius: 12px;
            }
            .file-item .file-icon {
                font-size: 1.4rem;
            }
            .file-item .file-name {
                font-size: 0.9rem;
            }
            .modal {
                border-radius: 24px;
            }
            .modal-header {
                padding: 1.1rem 1.2rem;
            }
            .modal-body {
                padding: 1.2rem;
            }
            .modal-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <header class="top-bar">
        <a href="index.html" class="brand">蒋语</a>
        <a href="投稿.html" class="submit-link">
            <span class="icon">✍️</span> 编辑
        </a>
    </header>

    <!-- 主内容 -->
    <main class="main-content">
        <h2 class="page-title">投稿</h2>
        <p class="page-subtitle">点击任意文件查看内容</p>

        <div class="file-manager">
            <div id="fileGrid" class="file-list">
                <div class="empty-message">正在读取目录…</div>
            </div>
        </div>

        <div class="footer-deco"></div>
    </main>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">
                    <span class="file-icon">ⓕ</span>
                    <span id="modalFileName">文件名</span>
                </div>
                <button class="modal-close" id="modalCloseBtn" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 内容动态插入 -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 配置区
        // ============================================================
        const GITHUB_OWNER = '你的用户名';
        const GITHUB_REPO = '你的仓库名';
        const GITHUB_BRANCH = 'main';

        const BASE_DIR = '';

        // ============================================================
        // 全局状态
        // ============================================================
        const fileGrid = document.getElementById('fileGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalFileName = document.getElementById('modalFileName');
        const modalBody = document.getElementById('modalBody');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        let manifestCache = null;

        async function loadManifest() {
            if (manifestCache) return manifestCache;
            const res = await fetch(`files.json?t=${Date.now()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            manifestCache = await res.json();
            return manifestCache;
        }

        function getEntriesFromManifest(manifest, targetPath) {
            if (!manifest) return [];

            let cleanPath = (targetPath || '').replace(/^\.?\//, '').replace(/\/$/, '');

            if (BASE_DIR) {
                const prefix = BASE_DIR.replace(/^\.?\//, '').replace(/\/$/, '');
                if (cleanPath === prefix) cleanPath = '';
                else if (cleanPath.startsWith(prefix + '/')) cleanPath = cleanPath.slice(prefix.length + 1);
            }

            if (!cleanPath) return manifest;

            const parts = cleanPath.split('/').filter(Boolean);
            let current = manifest;

            for (const part of parts) {
                const found = current.find(item => item.name === part && item.type === 'folder');
                if (!found) return [];
                current = found.children || [];
            }

            return current;
        }

        // ============================================================
        // 渲染文件管理器主界面（一行一行）
        // ============================================================
        async function loadFileManager() {
            fileGrid.innerHTML = '<div class="empty-message">正在读取目录…</div>';

            try {
                const manifest = await loadManifest();
                const entries = getEntriesFromManifest(manifest, BASE_DIR);

                if (entries.length === 0) {
                    fileGrid.innerHTML = '<div class="empty-message">此目录下没有可显示的文件（文件夹 / TXT / 图片）</div>';
                    return;
                }

                fileGrid.innerHTML = '';
                for (const entry of entries) {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    if (entry.type === 'folder') item.classList.add('is-folder');

                    const icon = document.createElement('div');
                    icon.className = 'file-icon';
                    icon.textContent = entry.type === 'folder' ? '📁' : (entry.type === 'image' ? '📚' : '🗒');

                    const label = document.createElement('div');
                    label.className = 'file-name';
                    label.textContent = entry.name;

                    item.appendChild(icon);
                    item.appendChild(label);
                    item.addEventListener('click', () => handleFileClick(entry));

                    fileGrid.appendChild(item);
                }
            } catch (err) {
                fileGrid.innerHTML = `<div class="empty-message">⚠️ 读取失败</span></div>`;
            }
        }

        // ============================================================
        // 处理文件点击
        // ============================================================
        async function handleFileClick(entry) {
            if (entry.type === 'folder') {
                openModal(entry.name, '📁', '<div class="modal-loading">正在读取文件夹…</div>');

                try {
                    const manifest = await loadManifest();
                    const innerEntries = getEntriesFromManifest(manifest, entry.path);

                    if (innerEntries.length === 0) {
                        modalBody.innerHTML = '<div class="empty-message">此文件夹为空</div>';
                        return;
                    }

                    const listDiv = document.createElement('div');
                    listDiv.className = 'inner-file-list';

                    for (const inner of innerEntries) {
                        const innerItem = document.createElement('div');
                        innerItem.className = 'inner-file-item';

                        const icon = document.createElement('div');
                        icon.className = 'file-icon';
                        icon.textContent = inner.type === 'folder' ? '📁' : (inner.type === 'image' ? '📚' : '🗒');

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'file-name';
                        nameDiv.textContent = inner.name;

                        innerItem.appendChild(icon);
                        innerItem.appendChild(nameDiv);
                        innerItem.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleFileClick(inner);
                        });

                        listDiv.appendChild(innerItem);
                    }

                    modalBody.innerHTML = '';
                    modalBody.appendChild(listDiv);

                } catch (err) {
                    modalBody.innerHTML = `<div class="modal-error">无法读取文件夹：${err.message}</div>`;
                }

            } else if (entry.type === 'text') {
                openModal(entry.name, '🗒', '<div class="modal-loading">正在加载文本…</div>');

                try {
                    const res = await fetch(`${entry.path}?t=${Date.now()}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();

                    modalBody.innerHTML = '';
                    const pre = document.createElement('pre');
                    pre.className = 'text-content';
                    pre.textContent = text;
                    modalBody.appendChild(pre);
                } catch (err) {
                    modalBody.innerHTML = `<div class="modal-error">无法加载文本内容：${err.message}</div>`;
                }

            } else if (entry.type === 'image') {
                openModal(entry.name, '📚', '<div class="modal-loading">正在加载图片…</div>');

                const img = document.createElement('img');
                img.className = 'image-preview';
                img.src = `${entry.path}?t=${Date.now()}`;
                img.alt = entry.name;

                img.onload = () => {
                    modalBody.innerHTML = '';
                    modalBody.appendChild(img);
                };
                img.onerror = () => {
                    modalBody.innerHTML = '<div class="modal-error">无法加载图片</div>';
                };
            }
        }

        // ============================================================
        // 弹窗控制
        // ============================================================
        function openModal(fileName, icon, contentHtml) {
            modalFileName.textContent = fileName;
            modalTitle.querySelector('.file-icon').textContent = icon;
            modalBody.innerHTML = contentHtml;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            modalBody.innerHTML = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        loadFileManager();
    </script>

</body>
</html>
