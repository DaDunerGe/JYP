<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYP选集投稿</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            width: 100%;
            background: rgba(20, 12, 24, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(116, 73, 128, 0.4);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(116, 73, 128, 0.15);
        }

        /* 品牌标识 */
        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            text-shadow: 0 0 18px rgba(116, 73, 128, 0.6);
            position: relative;
            white-space: nowrap;
        }

        .brand::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #744980;
            border-radius: 3px;
            box-shadow: 0 0 10px #744980;
        }

        /* 投稿按钮 —— 链接样式 */
        .submit-link {
            background: #744980;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(116, 73, 128, 0.4);
            font-family: inherit;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
            /* 确保链接在不同状态下表现一致 */
        }

        .submit-link:hover {
            background: #8c5a9e;
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.8);
            transform: translateY(-1px);
        }

        .submit-link:active {
            transform: translateY(1px);
            box-shadow: 0 0 12px rgba(116, 73, 128, 0.6);
        }

        .submit-link .icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* ===== 主内容区域 ===== */
        .main-content {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        /* 小提示区域 */
        .tip-box {
            margin: 0 0 1.2rem 0;
            text-align: center;
            font-size: 1.15rem;
            font-style: italic;
            color: #cbb2d4;
            background: rgba(116, 73, 128, 0.12);
            padding: 1rem 1.8rem;
            border-radius: 60px;
            border-left: 6px solid #744980;
            border-right: 1px solid rgba(116, 73, 128, 0.3);
            border-top: 1px solid rgba(116, 73, 128, 0.3);
            border-bottom: 1px solid rgba(116, 73, 128, 0.3);
            box-shadow: 0 0 20px rgba(116, 73, 128, 0.2);
            word-break: break-word;
        }

        .tip-box::before {
            content: '✦';
            color: #744980;
            font-weight: bold;
            margin-right: 12px;
            font-style: normal;
            text-shadow: 0 0 10px #744980;
        }

        /* 通知栏 */
        .notice-bar {
            margin-top: 1.2rem;
            padding: 1.2rem 1.8rem;
            background: rgba(116, 73, 128, 0.15);
            border: 1px solid rgba(116, 73, 128, 0.55);
            border-radius: 24px;
            color: #f0e6f5;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 18px rgba(116, 73, 128, 0.25);
            transition: opacity 0.3s, visibility 0.3s;
            word-break: break-word;
        }

        .notice-bar .badge {
            flex-shrink: 0;
            width: 10px;
            height: 10px;
            background: #744980;
            border-radius: 50%;
            box-shadow: 0 0 12px #744980, 0 0 4px #b48bc2;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .notice-bar.hidden {
            display: none;
        }

        /* ===== 写文章预留空间 ===== */
        .writing-space {
            margin-top: 2.5rem;
            background: rgba(20, 12, 24, 0.6);
            border: 1px dashed rgba(116, 73, 128, 0.45);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            text-align: center;
            color: #9a7ba8;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .writing-space:hover {
            border-color: rgba(116, 73, 128, 0.8);
            background: rgba(30, 18, 36, 0.7);
            box-shadow: 0 0 30px rgba(116, 73, 128, 0.15);
        }

        .writing-space::before {
            content: '✎';
            display: block;
            font-size: 2.8rem;
            color: #744980;
            opacity: 0.7;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 20px rgba(116, 73, 128, 0.5);
        }

        .writing-space .placeholder-text {
            font-style: italic;
            color: #8a6d97;
        }

        /* 底部装饰线 */
        .footer-deco {
            margin-top: 3rem;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #744980, #b48bc2, #744980, transparent);
            opacity: 0.6;
            border-radius: 2px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .top-bar {
                padding: 0.8rem 1.2rem;
            }
            .brand {
                font-size: 1.4rem;
            }
            .submit-link {
                padding: 0.5rem 1.1rem;
                font-size: 0.9rem;
            }
            .submit-link .icon {
                font-size: 1rem;
            }
            .main-content {
                padding: 1.8rem 1rem;
            }
            .tip-box {
                font-size: 1rem;
                padding: 0.8rem 1.2rem;
            }
            .notice-bar {
                padding: 1rem 1.2rem;
                font-size: 0.9rem;
            }
            .writing-space {
                padding: 1.8rem 1.2rem;
                border-radius: 24px;
            }
        }

        .loading-placeholder {
            color: #744980;
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- 顶部栏：品牌标题 + 投稿按钮（链接到 投稿.html） -->
    <header class="top-bar">
        <div class="brand">蒋语</div>
        <a href="投稿.html" class="submit-link">
            <span class="icon">ⓕ</span> 投稿
        </a>
    </header>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- 小提示区域：从 a.txt 随机获取一行 -->
        <div class="tip-box" id="tipDisplay">
            <span class="loading-placeholder">正在拾取灵感…</span>
        </div>

        <!-- 通知栏：从 b.txt 获取，空白则隐藏 -->
        <div class="notice-bar hidden" id="noticeBar">
            <span class="badge"></span>
            <span id="noticeContent"></span>
        </div>

        <!-- 写文章预留空间 -->
        <section class="writing-space" id="writingSpace">
            <span class="placeholder-text">本站旨在为蒋怡萍老师的学生提供收集并记录蒋老师及相关老师的言论和金句的平台。仅供学习和娱乐使用，请勿发表无关和违规内容，否则将被删除。\n站长：六力第一王帅</span>
        </section>

        <!-- 底部装饰线 -->
        <div class="footer-deco"></div>
    </main>

    <script>
        // ---------- 页面数据加载 ----------
        (async function() {
            // ---------- 1. 小提示：从 a.txt 随机读取一行 ----------
            const tipElement = document.getElementById('tipDisplay');

            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`a.txt?t=${timestamp}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');

                if (lines.length === 0) {
                    tipElement.innerHTML = `<span style="opacity:0.7;">阅读，理解，归纳，总结</span>`;
                } else {
                    const randomIndex = Math.floor(Math.random() * lines.length);
                    const randomLine = lines[randomIndex];
                    tipElement.innerHTML = '';
                    const span = document.createElement('span');
                    span.textContent = randomLine;
                    tipElement.appendChild(span);
                }
            } catch (error) {
                console.warn('读取失败:', error);
                tipElement.innerHTML = `<span style="opacity:0.7;"></span>`;
            }

            // ---------- 2. 通知栏：从 b.txt 读取，空白则隐藏 ----------
            const noticeBar = document.getElementById('noticeBar');
            const noticeContent = document.getElementById('noticeContent');

            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`b.txt?t=${timestamp}`);

                if (!response.ok) {
                    noticeBar.classList.add('hidden');
                    return;
                }

                const text = await response.text();
                const trimmedText = text.trim();

                if (trimmedText !== '') {
                    noticeContent.textContent = trimmedText;
                    noticeBar.classList.remove('hidden');
                } else {
                    noticeBar.classList.add('hidden');
                }
            } catch (error) {
                console.warn('读取失败:', error);
                noticeBar.classList.add('hidden');
            }
        })();
    </script>

</body>
</html>
