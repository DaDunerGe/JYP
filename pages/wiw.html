<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>洞内贴目标图（完美微调版）</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#1e1e1e;color:#ddd}
  header{padding:12px;background:#2a2a2a;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  button{background:#3a6ea5;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer}
  button:hover{background:#4a7eb5}
  .control{display:flex;align-items:center;gap:8px;font-size:14px}
  input[type=range]{width:150px}
  .wrap{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
  .panel{background:#252525;border-radius:6px;padding:12px;flex:1;min-width:320px}
  .panel h3{margin:0 0 12px;font-size:14px;color:#aaa}
  canvas{display:block;width:100%;height:auto;background:#555} 
  #preview{max-width:100%;}
</style>
</head>
<body>
<header>
  <label>目标图 <input type="file" id="dstFile" accept="image/*"></label>
  <div class="control">
    <span>放大/裁切倍率:</span>
    <input type="range" id="scaleSlider" min="1" max="2" step="0.01" value="1.05">
    <span id="scaleVal">1.05x</span>
  </div>
  <button id="exportBtn">导出 PNG</button>
  <span id="status" class="hint"></span>
</header>

<div class="wrap">
  <div class="panel">
    <h3>合成预览（拖动上方滑块可以控制裁剪大小）</h3>
    <canvas id="preview"></canvas>
  </div>
</div>

<script>
const SRC_W = 2432, SRC_H = 1600;

// 你的原数据（因为顺序问题，我之前发现点可能交叉了，这里做了安全反转，消除镜像）
const HOLE = [
  {x: 868,  y: 666},  // 左上
  {x: 884,  y: 377},  // 右上
  {x: 1669, y: 405},  // 右下
  {x: 1655, y: 948},  // 左下
];
// 注意：如果这组点还是不对，说明你的坐标本身就是一个扭曲的梯形，这里只是按不翻转的方式对齐。

const state = { srcImg: null, dstImg: null };

// 单应性矩阵
function solveHomography(src, dst){
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const {x,y}=src[i], {x:u,y:v}=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
  }
  const n=8;
  for(let i=0;i<n;i++){
    let p=i;
    for(let j=i+1;j<n;j++) if(Math.abs(A[j][i])>Math.abs(A[p][i])) p=j;
    [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    if(Math.abs(A[i][i])<1e-12) return null;
    for(let j=i+1;j<n;j++){
      const f=A[j][i]/A[i][i];
      for(let k=i;k<n;k++) A[j][k]-=f*A[i][k];
      b[j]-=f*b[i];
    }
  }
  const h=new Array(8);
  for(let i=n-1;i>=0;i--){
    let s=b[i];
    for(let j=i+1;j<n;j++) s-=A[i][j]*h[j];
    h[i]=s/A[i][i];
  }
  return [h[0],h[1],h[2], h[3],h[4],h[5], h[6],h[7],1];
}

function invert3x3(m){
  const [a,b,c,d,e,f,g,h,i]=m;
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g;
  const det=a*A+b*B+c*C;
  if(Math.abs(det)<1e-12) return null;
  const inv=1/det;
  return [
    A*inv, (c*h-b*i)*inv, (b*f-c*e)*inv,
    B*inv, (a*i-c*g)*inv, (c*d-a*f)*inv,
    C*inv, (b*g-a*h)*inv, (a*e-b*d)*inv
  ];
}

function warpImage(srcImg, H, outW, outH){
  const sc=document.createElement('canvas');
  sc.width=srcImg.width; sc.height=srcImg.height;
  const sctx=sc.getContext('2d',{willReadFrequently:true});
  sctx.drawImage(srcImg,0,0);
  const srcData=sctx.getImageData(0,0,sc.width,sc.height).data;

  const out=new ImageData(outW,outH);
  const Hinv=invert3x3(H);
  if(!Hinv) return out;
  const od=out.data;

  for(let v=0;v<outH;v++){
    for(let u=0;u<outW;u++){
      const w=Hinv[6]*u+Hinv[7]*v+Hinv[8];
      if(Math.abs(w)<1e-12) continue;
      const x=(Hinv[0]*u+Hinv[1]*v+Hinv[2])/w;
      const y=(Hinv[3]*u+Hinv[4]*v+Hinv[5])/w;
      if(x<0||y<0||x>=sc.width||y>=sc.height) continue;
      const x0=Math.floor(x), y0=Math.floor(y);
      const x1=Math.min(x0+1,sc.width-1), y1=Math.min(y0+1,sc.height-1);
      const fx=x-x0, fy=y-y0;
      const i00=(y0*sc.width+x0)*4, i10=(y0*sc.width+x1)*4;
      const i01=(y1*sc.width+x0)*4, i11=(y1*sc.width+x1)*4;
      const di=(v*outW+u)*4;
      for(let k=0;k<4;k++){
        const top=srcData[i00+k]*(1-fx)+srcData[i10+k]*fx;
        const bot=srcData[i01+k]*(1-fx)+srcData[i11+k]*fx;
        od[di+k]=top*(1-fy)+bot*fy;
      }
    }
  }
  return out;
}

function composite(){
  if(!state.srcImg || !state.dstImg) return;

  // 1. 获取放大倍率（默认 1.05 倍，防止露边）
  const scale = parseFloat(document.getElementById('scaleSlider').value);
  document.getElementById('scaleVal').textContent = scale.toFixed(2) + 'x';

  // 2. 计算洞的外接矩形，为了等比放置原图
  const minX = Math.min(...HOLE.map(p=>p.x));
  const maxX = Math.max(...HOLE.map(p=>p.x));
  const minY = Math.min(...HOLE.map(p=>p.y));
  const maxY = Math.max(...HOLE.map(p=>p.y));
  const holeW = maxX - minX;
  const holeH = maxY - minY;

  // 3. 创建一个中间画布，大小为洞的外接矩形
  const midCanvas = document.createElement('canvas');
  midCanvas.width = Math.ceil(holeW);
  midCanvas.height = Math.ceil(holeH);
  const mctx = midCanvas.getContext('2d');

  // 4. 等比缩放目标图，使其铺满外接矩形（Cover 模式）
  const dstW = state.dstImg.width;
  const dstH = state.dstImg.height;
  const scaleToCover = Math.max(holeW / dstW, holeH / dstH) * scale; 
  
  const drawW = dstW * scaleToCover;
  const drawH = dstH * scaleToCover;
  const offsetX = (holeW - drawW) / 2;
  const offsetY = (holeH - drawH) / 2;

  mctx.drawImage(state.dstImg, offsetX, offsetY, drawW, drawH);

  // 5. 获取外接矩形的四个角（加上偏移）
  const MidP = [
    {x: 0, y: 0},
    {x: holeW, y: 0},
    {x: holeW, y: holeH},
    {x: 0, y: holeH}
  ];

  // 6. 求单应性矩阵：从中间画布映射到洞的四个点
  const H = solveHomography(MidP, HOLE);
  if(!H){ document.getElementById('status').textContent='矩阵求解失败'; return; }

  // 7. 把中间画布 warp 到素材原坐标系（2432×1600）
  const warped = warpImage(midCanvas, H, SRC_W, SRC_H);
  const wc=document.createElement('canvas');
  wc.width=SRC_W; wc.height=SRC_H;
  wc.getContext('2d').putImageData(warped,0,0);

  // 8. 最终合成
  const out=document.createElement('canvas');
  out.width=SRC_W; out.height=SRC_H;
  const ctx=out.getContext('2d');
  
  ctx.fillStyle = '#555'; // 灰色底，看透明情况
  ctx.fillRect(0, 0, SRC_W, SRC_H);
  
  ctx.drawImage(wc, 0, 0); // 铺上目标图（不翻转了！）
  ctx.drawImage(state.srcImg,0,0,SRC_W,SRC_H); // 盖上带洞的素材

  // 缩放预览
  const maxW=900;
  const s=Math.min(1, maxW/SRC_W);
  const pw=Math.round(SRC_W*s), ph=Math.round(SRC_H*s);
  const preview=document.getElementById('preview');
  preview.width=pw; preview.height=ph;
  const pctx=preview.getContext('2d');
  pctx.drawImage(out,0,0,pw,ph);

  document.getElementById('status').textContent = '合成完成';
}

// 绑定滑块事件，实时刷新
document.getElementById('scaleSlider').addEventListener('input', composite);

document.getElementById('dstFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  state.dstImg=await createImageBitmap(f);
  composite();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(!state.srcImg || !state.dstImg) return;
  
  // 导出逻辑同 composite 渲染，不需要界面元素
  const scale = parseFloat(document.getElementById('scaleSlider').value);
  const minX = Math.min(...HOLE.map(p=>p.x));
  const maxX = Math.max(...HOLE.map(p=>p.x));
  const minY = Math.min(...HOLE.map(p=>p.y));
  const maxY = Math.max(...HOLE.map(p=>p.y));
  const holeW = maxX - minX;
  const holeH = maxY - minY;

  const midCanvas = document.createElement('canvas');
  midCanvas.width = Math.ceil(holeW);
  midCanvas.height = Math.ceil(holeH);
  const mctx = midCanvas.getContext('2d');
  const dstW = state.dstImg.width;
  const dstH = state.dstImg.height;
  const scaleToCover = Math.max(holeW / dstW, holeH / dstH) * scale; 
  const drawW = dstW * scaleToCover;
  const drawH = dstH * scaleToCover;
  mctx.drawImage(state.dstImg, (holeW - drawW)/2, (holeH - drawH)/2, drawW, drawH);

  const MidP = [{x:0,y:0}, {x:holeW,y:0}, {x:holeW,y:holeH}, {x:0,y:holeH}];
  const H = solveHomography(MidP, HOLE);
  const warped = warpImage(midCanvas, H, SRC_W, SRC_H);
  const wc=document.createElement('canvas'); wc.width=SRC_W; wc.height=SRC_H;
  wc.getContext('2d').putImageData(warped,0,0);
  
  const out=document.createElement('canvas'); out.width=SRC_W; out.height=SRC_H;
  const ctx=out.getContext('2d');
  ctx.drawImage(wc,0,0);
  ctx.drawImage(state.srcImg,0,0,SRC_W,SRC_H);
  
  out.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='composite.png';
    a.click();
  });
});

async function loadSource(url){
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    state.srcImg=await createImageBitmap(blob);
    document.getElementById('status').textContent='a.png 已加载，请上传目标图';
  }catch(err){
    document.getElementById('status').textContent=
      `a.png 加载失败（${err.message}），请用本地服务器打开页面`;
  }
}
loadSource('a.png');
</script>
</body>
</html>
