<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>透视贴合（完美无损版）</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#1e1e1e;color:#ddd}
  header{padding:12px;background:#2a2a2a;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  button{background:#3a6ea5;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer}
  button:hover{background:#4a7eb5}
  .control{display:flex;align-items:center;gap:8px;font-size:14px}
  input[type=range]{width:150px}
  .wrap{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
  .panel{background:#252525;border-radius:6px;padding:12px;flex:1;min-width:320px}
  .panel h3{margin:0 0 12px;font-size:14px;color:#aaa}
  canvas{display:block;width:100%;height:auto;background:#444} 
  #preview{max-width:100%;}
</style>
</head>
<body>
<header>
  <label>目标图 <input type="file" id="dstFile" accept="image/*"></label>
  <div class="control">
    <span>大小微调:</span>
    <input type="range" id="scaleSlider" min="0.5" max="2" step="0.01" value="1.0">
    <span id="scaleVal">1.00x</span>
  </div>
  <button id="exportBtn">导出 PNG</button>
  <span id="status" class="hint"></span>
</header>

<div class="wrap">
  <div class="panel">
    <h3>合成预览（透视变形，保持素材斜度）</h3>
    <canvas id="preview"></canvas>
  </div>
</div>

<script>
const SRC_W = 2432, SRC_H = 1600;

// 【保持原始坐标】 左上、右上、右下、左下
const HOLE = [
  {x: 884,  y: 377},
  {x: 1669, y: 405},
  {x: 1655, y: 948},
  {x: 868,  y: 666},
];

const state = { srcImg: null, dstImg: null };

// --- 核心：利用 Canvas 2D 的三角形仿射变换来模拟透视 ---
function drawPerspectiveTriangle(ctx, img, p0, p1, p2, u0, u1, u2) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.closePath();
  ctx.clip();

  // 计算变换矩阵
  let x0 = u0.x, y0 = u0.y;
  let x1 = u1.x, y1 = u1.y;
  let x2 = u2.x, y2 = u2.y;
  
  let denom = x0 * (y2 - y1) - x1 * y2 + x2 * y1 + (x1 - x2) * y0;
  if (denom === 0) { ctx.restore(); return; }

  let a = -(y0 * (x2 - x1) - y1 * x2 + y2 * x1 + (y1 - y2) * x0) / denom;
  let b = (y0 * (p2.x - p1.x) - y1 * p2.x + y2 * p1.x + (y1 - y2) * p0.x) / denom;
  let c = (x0 * (p2.x - p1.x) - x1 * p2.x + x2 * p1.x + (x1 - x2) * p0.x) / denom;
  let d = -(x0 * (y2 - y1) - x1 * y2 + x2 * y1 + (x1 - x2) * y0) / denom;
  let e = (x0 * (p2.y - p1.y) - x1 * p2.y + x2 * p1.y + (x1 - x2) * p0.y) / denom;
  let f = (y0 * (p2.y - p1.y) - y1 * p2.y + y2 * p1.y + (y1 - y2) * p0.y) / denom;
  let g = (x0 * (y2 - y1) - x1 * y2 + x2 * y1 + (x1 - x2) * y0) / denom;

  ctx.transform(a, d, b, e, c, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

function warpImagePerspective(srcImg, targetPts, drawW, drawH) {
  const canvas = document.createElement('canvas');
  canvas.width = SRC_W;
  canvas.height = SRC_H;
  const ctx = canvas.getContext('2d');

  // 原图的四个角
  const u0 = {x: 0, y: 0};
  const u1 = {x: drawW, y: 0};
  const u2 = {x: drawW, y: drawH};
  const u3 = {x: 0, y: drawH};

  // 拆成两个三角形，分别做仿射透视映射
  drawPerspectiveTriangle(ctx, srcImg, targetPts[0], targetPts[1], targetPts[2], u0, u1, u2);
  drawPerspectiveTriangle(ctx, srcImg, targetPts[0], targetPts[2], targetPts[3], u0, u2, u3);

  return canvas;
}

function composite(){
  if(!state.srcImg || !state.dstImg) return;

  const scale = parseFloat(document.getElementById('scaleSlider').value);
  document.getElementById('scaleVal').textContent = scale.toFixed(2) + 'x';

  const out = document.createElement('canvas');
  out.width = SRC_W; out.height = SRC_H;
  const ctx = out.getContext('2d');

  // 灰色背景
  ctx.fillStyle = '#444';
  ctx.fillRect(0, 0, SRC_W, SRC_H);

  const dstW = state.dstImg.width;
  const dstH = state.dstImg.height;

  // 1. 计算洞的外接矩形（用于确定图片初始缩放）
  const minX = Math.min(...HOLE.map(p=>p.x));
  const maxX = Math.max(...HOLE.map(p=>p.x));
  const minY = Math.min(...HOLE.map(p=>p.y));
  const maxY = Math.max(...HOLE.map(p=>p.y));
  const bboxW = maxX - minX;
  const bboxH = maxY - minY;

  // 2. 计算图片为了覆盖洞，需要的宽高 (配合滑块微调)
  const scaleToFill = Math.max(bboxW / dstW, bboxH / dstH) * scale;
  const drawW = dstW * scaleToFill;
  const drawH = dstH * scaleToFill;

  // 3. 执行透视变形（把原图拉伸/折进洞里）
  const warpedCanvas = warpImagePerspective(state.dstImg, HOLE, drawW, drawH);

  // 4. 画变形后的图（由于 warpedCanvas 是原尺寸，所以画的时候按原尺寸画）
  ctx.drawImage(warpedCanvas, 0, 0);

  // 5. 盖上透明洞素材
  ctx.drawImage(state.srcImg, 0, 0, SRC_W, SRC_H);

  // 预览
  const maxW = 900;
  const s = Math.min(1, maxW / SRC_W);
  const pw = Math.round(SRC_W * s), ph = Math.round(SRC_H * s);
  const preview = document.getElementById('preview');
  preview.width = pw; preview.height = ph;
  const pctx = preview.getContext('2d');
  pctx.drawImage(out, 0, 0, pw, ph);

  document.getElementById('status').textContent = '合成完成';
}

document.getElementById('scaleSlider').addEventListener('input', composite);

document.getElementById('dstFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  state.dstImg = await createImageBitmap(f);
  composite();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(!state.srcImg || !state.dstImg) return;
  
  const scale = parseFloat(document.getElementById('scaleSlider').value);
  const out = document.createElement('canvas'); out.width = SRC_W; out.height = SRC_H;
  const ctx = out.getContext('2d');
  
  const dstW = state.dstImg.width, dstH = state.dstImg.height;
  const minX = Math.min(...HOLE.map(p=>p.x));
  const maxX = Math.max(...HOLE.map(p=>p.x));
  const minY = Math.min(...HOLE.map(p=>p.y));
  const maxY = Math.max(...HOLE.map(p=>p.y));
  const bboxW = maxX - minX;
  const bboxH = maxY - minY;

  const scaleToFill = Math.max(bboxW / dstW, bboxH / dstH) * scale;
  const drawW = dstW * scaleToFill, drawH = dstH * scaleToFill;

  const warpedCanvas = warpImagePerspective(state.dstImg, HOLE, drawW, drawH);
  
  ctx.drawImage(warpedCanvas, 0, 0);
  ctx.drawImage(state.srcImg, 0, 0, SRC_W, SRC_H);
  
  out.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'composite.png';
    a.click();
  });
});

async function loadSource(url){
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    state.srcImg = await createImageBitmap(blob);
    document.getElementById('status').textContent = 'a.png 已加载，请上传目标图';
  }catch(err){
    document.getElementById('status').textContent = `a.png 加载失败（${err.message}）`;
  }
}
loadSource('a.png');
</script>
</body>
</html>
